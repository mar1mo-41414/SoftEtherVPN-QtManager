name: Release

# vX.Y.Z タグをpushすると、以下のビルド成果物を添えてGitHub Releaseを作成する:
#   - macOS (Apple Silicon / arm64) の .app を固めたzip
#   - Linux x86_64 / arm64 のAppImage
#
# macOS Intel (x86_64) 版はGitHub Actionsのホスト型ランナーがIntel Macの提供を終了して
# いるため含めない(手動ビルドで別途用意する)。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: brew install qt cmake
      - name: Build .app
        run: packaging/macos/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/macos/SoftEtherVPN-QtManager-macos.zip

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-l10n-tools qt6-tools-dev \
              cmake build-essential libfuse2t64 || sudo apt-get install -y libfuse2
      - name: Build AppImage
        run: bash packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/linux/*.AppImage

  release:
    needs: [macos-arm64, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true
