name: Release

# vX.Y.Z タグをpushすると、以下のビルド成果物を添えてGitHub Releaseを作成する:
#   - Linux x86_64 / arm64 のAppImage
#
# macOS (arm64 / x86_64 とも) はいったん手動ビルド運用。
# macos-14ランナーで`cmake --build`の最終リンク直前(全ソースのコンパイルが終わった直後)で
# 毎回ハングする現象を2回連続で確認した(ローカルのApple Siliconビルドでは同じコードが
# 1〜2分で完走する)。GitHub Actions側もmacOS arm64ランナーの容量不足を案内しており、
# 原因がこちらのビルド手順かCI環境固有の問題か切り分けできていないため、
# 無理に自動化を追わず手動ビルド(`packaging/macos/build-app.sh`)でReleaseに添付する方針とした。
# 詳細はdocs/PACKAGING.md参照。原因が分かれば自動化に戻す。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-l10n-tools qt6-tools-dev \
              cmake build-essential libfuse2t64 || sudo apt-get install -y libfuse2
      - name: Build AppImage
        run: bash packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/linux/*.AppImage

  release:
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          generate_release_notes: true
